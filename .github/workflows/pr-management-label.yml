name: Pull Request Management - Testing label

on:
  pull_request:
    paths:
      - src
    types:
      - synchronize

env:
  REQUIRES_TESTING_LABEL_NAME: 'PR: Requires Testing'

jobs:
  remove-testing-label:
    runs-on: ubuntu-latest
    steps:
      - name: Remove in testing label
        uses: actions/github-script@v8
        env:
          REQUIRED_LABEL: ${{ github.env.REQUIRES_TESTING_LABEL_NAME }}
        with:
          result-encoding: string
          retries: 3
          script: |
            github.rest.issues.addLabels({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: [{ name: process.env.REQUIRED_LABEL }]
            })
